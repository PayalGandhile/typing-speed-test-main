<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <!-- <link rel="stylesheet" href="style.css"> -->
  <title>Frontend Mentor | Typing Speed Test</title>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <img src="./assets/images/logo-small.svg" alt="Typing Speed Test logo" width="32" height="32">
      <div class="logo-text">
        <span class="logo-title">Typing Speed Test</span>
        <span class="logo-sub">Type as fast as you can in 60 seconds</span>
      </div>
    </div>
    <div class="personal-best">
      <img src="./assets/images/icon-personal-best.svg" alt="trophy" width="20" height="20">
      <span>Personal best: <strong id="personal-best-value">--</strong> WPM</span>
    </div>
  </header>

  <!-- MAIN TEST SCREEN -->
  <main id="test-screen" class="test-screen">

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat">
        <span class="stat-label">WPM:</span>
        <strong class="stat-value" id="wpm">0</strong>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-label">Accuracy:</span>
        <strong class="stat-value accent-red" id="accuracy">100%</strong>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-label">Time:</span>
        <strong class="stat-value accent-yellow" id="time-display">0:60</strong>
      </div>

      <div class="controls-group">
        <div class="control-section">
          <span class="control-label">Difficulty:</span>
          <div class="btn-group" role="group" aria-label="Difficulty">
            <button class="btn-toggle" data-difficulty="easy">Easy</button>
            <button class="btn-toggle" data-difficulty="medium">Medium</button>
            <button class="btn-toggle active" data-difficulty="hard">Hard</button>
          </div>
        </div>
        <div class="control-section">
          <span class="control-label">Mode:</span>
          <div class="btn-group" role="group" aria-label="Mode">
            <button class="btn-toggle active" data-mode="timed">Timed (60s)</button>
            <button class="btn-toggle" data-mode="passage">Passage</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Passage Display Area -->
    <div class="passage-wrapper">
      <div id="text-display" class="text-display" tabindex="0" aria-label="Typing passage, click to start"></div>

      <!-- Start Overlay -->
      <div id="start-overlay" class="start-overlay">
        <button id="start-btn" class="btn-start">Start Typing Test</button>
        <p class="start-hint">Or click the text and start typing</p>
      </div>
    </div>

    <!-- Hidden input to capture keystrokes -->
    <input type="text" id="hidden-input" class="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-hidden="true" tabindex="-1">

    <!-- Bottom divider + Restart -->
    <div class="bottom-bar">
      <hr class="divider">
      <button id="restart-btn" class="btn-restart" aria-label="Restart test">
        Restart Test
        <img src="./assets/images/icon-restart.svg" alt="" width="16" height="16">
      </button>
    </div>

  </main>

  <!-- RESULTS SCREEN -->
  <section id="results-screen" class="results-screen hidden" aria-live="polite">

    <!-- Decorative stars -->
    <img src="./assets/images/pattern-star-1.svg" alt="" class="deco-star star-left" aria-hidden="true">
    <img src="./assets/images/pattern-star-2.svg" alt="" class="deco-star star-right" aria-hidden="true">

    <!-- Result icon -->
    <div id="result-icon-wrapper" class="result-icon-wrapper"></div>

    <h1 id="result-title" class="result-title"></h1>
    <p id="result-subtitle" class="result-subtitle"></p>

    <!-- Result stats -->
    <div class="result-stats">
      <div class="result-stat-card">
        <span class="result-stat-label">WPM:</span>
        <strong id="result-wpm" class="result-stat-value">0</strong>
      </div>
      <div class="result-stat-card">
        <span class="result-stat-label">Accuracy:</span>
        <strong id="result-accuracy" class="result-stat-value accent-red">0%</strong>
      </div>
      <div class="result-stat-card">
        <span class="result-stat-label">Characters</span>
        <strong class="result-stat-value">
          <span id="result-chars-correct" class="accent-green">0</span>/<span id="result-chars-wrong" class="accent-red">0</span>
        </strong>
      </div>
    </div>

    <button id="go-again-btn" class="btn-go-again">
      Go Again
      <img src="./assets/images/icon-restart.svg" alt="" width="16" height="16">
    </button>

    <!-- Confetti canvas (new PB) -->
    <canvas id="confetti-canvas" class="confetti-canvas" aria-hidden="true"></canvas>
  </section>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener">Frontend Mentor</a>.
    Coded by <a href="#">Payal DipaK Gandhile</a>.
  </div>

  <script src="./script.js"></script>
</body>
</html>
