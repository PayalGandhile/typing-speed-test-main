<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./assets/style/style.css">
  
  <title>Frontend Mentor | Typing Speed Test</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <div class="container">
  <!-- Personal best: PB WPM -->

  <div class="top-bar">
    <div class="personal-best">
      Personal best: <span id="personal-best">0</span> WPM
    </div>
  </div>

   <!-- WPM: WPM
  Accuracy: Accuracy
  Time: Time -->

  <div class="stats">
    <span>WPM: <span id="wpm">0</span></span>
    <span>Accuracy: <span id="accuracy">100</span>%</span>
    <span>Time: <span id="time">60</span>s</span>
  </div>

   <!-- Difficulty:
  Easy
  Medium
  Hard -->

  <div class="controls">
    <div>
      <strong>Difficulty:</strong>
      <button data-difficulty="easy">Easy</button>
      <button data-difficulty="medium">Medium</button>
      <button data-difficulty="hard">Hard</button>
    </div>
<!-- Mode:
  Timed (60s)
  Passage -->

    <div>
      <strong>Mode:</strong>
      <button data-mode="timed">Timed (60s)</button>
      <button data-mode="passage">Passage</button>
    </div>
  </div>

   <!-- Passage -->

  <!-- Start Typing Test
  Or click the text and start typing -->

  <div id="text-display"></div>

  <input type="text" id="hidden-input" autofocus />

  <button id="restart">Restart</button>

</div>

 
 
  

  <!-- Test Complete Start -->

  <!-- Test Complete!
  Solid run. Keep pushing to beat your high score. -->

  <!-- WPM: WPM
  Accuracy: Accuracy
  Characters: Correct/Incorrect

  Go Again -->
  
  <!-- Test Complete End -->

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Payal DipaK Gandhile</a>.
  </div>
   <script src="./script.js"></script>
</body>
</html>
